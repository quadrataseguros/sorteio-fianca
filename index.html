<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Seguro Fiança Porto</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0052A3;
            --primary-light: #E6F0FF;
            --success: #22C55E;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
            --bg-white: #FFFFFF;
            --bg-gray: #F9FAFB;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-gray); color: var(--text-dark); padding: 16px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { color: var(--primary); font-size: 32px; margin-bottom: 8px; }
        .tabs { display: flex; gap: 0; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; cursor: pointer; color: var(--text-light); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .btn { padding: 12px 24px; border: none; cursor: pointer; font-weight: 600; border-radius: 4px; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--text-light); color: white; }
        .message { margin-bottom: 16px; padding: 12px; border-radius: 4px; }
        .message.success { background: #E6F9E6; color: #22C55E; }
        .message.error { background: #FFE6E6; color: #991B1B; }
        .participants-list { max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
        .participant-item { padding: 12px; border-bottom: 1px solid var(--border); }
        .stat-box { background: var(--primary-light); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 700; color: var(--primary); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 Sorteio de Brindes</h1>
            <p>Seguro Fiança Locatícia - Porto Seguro</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="abrirAba('participar')">Participar</button>
            <button class="tab-btn" onclick="abrirAba('sorteio')">Sorteio</button>
            <button class="tab-btn" onclick="abrirAba('ganhadores')">Ganhadores</button>
            <button class="tab-btn" onclick="abrirAba('qrcode')">QR Code</button>
        </div>

        <!-- PARTICIPAR -->
        <div id="participar" class="tab-content active">
            <div id="message"></div>
            <form onsubmit="salvarParticipante(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>WhatsApp/Telefone</label>
                    <input type="tel" id="telefone" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label>Empresa (opcional)</label>
                    <input type="text" id="empresa" placeholder="Seu negócio">
                </div>
                <button type="submit" class="btn btn-primary">✅ Participar do Sorteio</button>
            </form>
        </div>

        <!-- SORTEIO -->
        <div id="sorteio" class="tab-content">
            <div class="stat-box">
                <div class="stat-number" id="totalParticipantes">0</div>
                <div>Participantes</div>
            </div><br>
            <div class="participants-list" id="listaParticipantes">
                <div class="empty-state">Nenhum participante ainda.</div>
            </div><br>
            <button class="btn btn-primary" onclick="realizarSorteio()">🎲 SORTEAR AGORA</button>
        </div>

        <!-- GANHADORES -->
        <div id="ganhadores" class="tab-content">
            <div id="winnersDisplay"></div>
        </div>

        <!-- QR CODE -->
        <div id="qrcode" class="tab-content">
            <div style="text-align: center;">
                <p>Escaneie para participar:</p>
                <div id="qrCode" style="margin: 20px 0;"></div>
                <button class="btn btn-primary" onclick="baixarQRCode()">📥 Baixar QR Code</button>
            </div>
        </div>
    </div>

    <script>
        function abrirAba(nome) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(nome).classList.add('active');
            event.target.classList.add('active');
            
            if (nome === 'sorteio') atualizarLista();
            if (nome === 'qrcode' && !document.querySelector('#qrCode canvas')) gerarQRCode();
        }

        function salvarParticipante(e) {
            e.preventDefault();
            try {
                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim();
                const telefone = document.getElementById('telefone').value.trim();
                const empresa = document.getElementById('empresa').value.trim();

                let participantes = [];
                try {
                    const dados = localStorage.getItem('participantes');
                    participantes = dados ? JSON.parse(dados) : [];
                } catch(err) {
                    console.error('Erro ao ler localStorage:', err);
                    participantes = [];
                }

                participantes.push({nome, email, telefone, empresa});
                localStorage.setItem('participantes', JSON.stringify(participantes));

                mostrarMensagem('✅ Você está no sorteio! Boa sorte!', 'success');
                document.querySelector('form').reset();
                atualizarLista();
            } catch(err) {
                console.error('Erro:', err);
                mostrarMensagem('❌ Erro ao participar!', 'error');
            }
        }

        function atualizarLista() {
            try {
                const dados = localStorage.getItem('participantes');
                const participantes = dados ? JSON.parse(dados) : [];
                document.getElementById('totalParticipantes').textContent = participantes.length;
                
                if (participantes.length === 0) {
                    document.getElementById('listaParticipantes').innerHTML = '<div class="empty-state">Nenhum participante ainda.</div>';
                    return;
                }

                const html = participantes.map((p, i) => `
                    <div class="participant-item">
                        <strong>${i+1}. ${p.nome}</strong><br>
                        ${p.email} • ${p.telefone}
                    </div>
                `).join('');
                document.getElementById('listaParticipantes').innerHTML = html;
            } catch(err) {
                console.error('Erro ao listar:', err);
            }
        }

        function realizarSorteio() {
            try {
                const dados = localStorage.getItem('participantes');
                const participantes = dados ? JSON.parse(dados) : [];

                if (participantes.length < 5) {
                    alert('Precisa de pelo menos 5 participantes!');
                    return;
                }

                const shuffled = [...participantes].sort(() => Math.random() - 0.5);
                const ganhadores = shuffled.slice(0, 5);

                localStorage.setItem('ganhadores', JSON.stringify(ganhadores));
                mostrarGanhadores(ganhadores);
            } catch(err) {
                console.error('Erro no sorteio:', err);
                alert('Erro ao realizar sorteio!');
            }
        }

        function mostrarGanhadores(ganhadores) {
            const posicoes = ['🥇 1º LUGAR', '🥈 2º LUGAR', '🥉 3º LUGAR', '4º LUGAR', '5º LUGAR'];
            const html = ganhadores.map((g, i) => `
                <div style="background: #E6F9E6; border: 2px solid #22C55E; padding: 20px; margin: 16px 0; border-radius: 8px;">
                    <div style="color: #22C55E; font-weight: bold; margin-bottom: 8px;">${posicoes[i]}</div>
                    <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">${g.nome}</div>
                    <div>${g.email}</div>
                    <div>${g.telefone}</div>
                </div>
            `).join('');

            document.getElementById('winnersDisplay').innerHTML = html + '<br><button class="btn btn-secondary" onclick="limparSorteio()">Novo Sorteio</button>';
            document.querySelectorAll('.tab-btn')[2].click();
            confetti();
        }

        function limparSorteio() {
            localStorage.removeItem('ganhadores');
            document.getElementById('winnersDisplay').innerHTML = '';
            abrirAba('sorteio');
        }

        function gerarQRCode() {
            try {
                const qr = document.getElementById('qrCode');
                qr.innerHTML = '';
                new QRCode(qr, {
                    text: window.location.href,
                    width: 256,
                    height: 256,
                    colorDark: '#0052A3',
                    colorLight: '#FFFFFF',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch(err) {
                console.error('Erro QR:', err);
            }
        }

        function baixarQRCode() {
            const canvas = document.querySelector('#qrCode canvas');
            if (!canvas) { alert('QR Code não gerado ainda'); return; }
            const a = document.createElement('a');
            a.href = canvas.toDataURL();
            a.download = 'sorteio-fianca.png';
            a.click();
        }

        function confetti() {
            const emojis = ['🎉', '🎊', '🎁', '🏆', '⭐'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.position = 'fixed';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.top = '-50px';
                    el.style.fontSize = '24px';
                    el.style.pointerEvents = 'none';
                    document.body.appendChild(el);

                    let top = -50;
                    const int = setInterval(() => {
                        top += 5;
                        el.style.top = top + 'px';
                        if (top > window.innerHeight) { clearInterval(int); el.remove(); }
                    }, 20);
                }, i * 30);
            }
        }

        function mostrarMensagem(msg, tipo) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + tipo;
            setTimeout(() => el.className = 'message', 3000);
        }

        atualizarLista();
    </script>
</body>
</html>
