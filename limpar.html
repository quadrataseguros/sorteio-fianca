<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Dados - Sorteio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0052A3 0%, #001F4D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #0052A3;
            margin-bottom: 20px;
            font-size: 28px;
        }
        p {
            color: #6B7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-limpar {
            background: #EF4444;
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .btn-limpar:hover {
            background: #DC2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2);
        }
        .btn-voltar {
            background: #E5E7EB;
            color: #1F2937;
            flex: 1;
            min-width: 150px;
        }
        .btn-voltar:hover {
            background: #D1D5DB;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 6px;
            display: none;
            font-weight: 600;
        }
        .status.success {
            background: #E6F9E6;
            color: #22C55E;
            display: block;
        }
        .status.error {
            background: #FFE6E6;
            color: #991B1B;
            display: block;
        }
        .loading {
            display: none;
            color: #0052A3;
            font-weight: 600;
            margin-top: 20px;
        }
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Limpar Dados</h1>
        <p>Clique para apagar todos os participantes registrados durante os testes.</p>

        <div class="button-group">
            <button class="btn-limpar" onclick="limparDados(this)">Limpar Tudo</button>
            <button class="btn-voltar" onclick="voltarAoSorteio()">Voltar</button>
        </div>

        <div class="loading" id="loading">
            ⏳ Apagando dados...
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://tqenmuittslwlaeurqgt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_IqFn5uOBeHm8bEDHwK3HUg_44xA_Pyl";

        let supabaseClient = null;

        function getSupabase() {
            if (!supabaseClient && window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return supabaseClient;
        }

        async function limparDados(btn) {
            console.log('Iniciando limpeza...');

            if (!confirm('⚠️ Tem certeza que quer apagar TODOS os dados?')) {
                console.log('Cancelado na primeira confirmação');
                return;
            }

            if (!confirm('⚠️ CONFIRMAÇÃO FINAL: Vai apagar tudo mesmo?')) {
                console.log('Cancelado na segunda confirmação');
                return;
            }

            document.getElementById('loading').classList.add('show');
            const statusEl = document.getElementById('status');
            statusEl.className = 'status';
            statusEl.textContent = '';

            try {
                console.log('Conectando ao Supabase...');

                btn.disabled = true;
                btn.textContent = 'Apagando...';

                const supabase = getSupabase();
                if (!supabase) {
                    throw new Error('Supabase não inicializou. Recarregue a página.');
                }

                console.log('Iniciando delete...');
                const { data, error } = await supabase
                    .from('participantes')
                    .delete()
                    .neq('id', 0);

                console.log('Resposta:', { data, error });

                if (error) {
                    throw new Error(error.message || 'Erro ao apagar');
                }

                statusEl.className = 'status success';
                statusEl.textContent = '✅ Todos os dados foram apagados com sucesso!';
                document.getElementById('loading').classList.remove('show');
                btn.textContent = 'Limpar Tudo';

                console.log('Limpeza concluída! Redirecionando...');
                setTimeout(() => {
                    voltarAoSorteio();
                }, 2000);

            } catch(err) {
                console.error('❌ Erro completo:', err);
                document.getElementById('loading').classList.remove('show');

                statusEl.className = 'status error';
                statusEl.textContent = '❌ Erro: ' + (err.message || 'Erro desconhecido ao apagar dados');

                btn.disabled = false;
                btn.textContent = 'Limpar Tudo';
            }
        }

        function voltarAoSorteio() {
            window.location.href = './index.html?admin';
        }
    </script>
</body>
</html>
