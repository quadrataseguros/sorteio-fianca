<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio - Tela Projetor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0052A3 0%, #001F4D 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            animation: fadeInOut 16s infinite;
        }

        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5.33s; }
        .slide:nth-child(3) { animation-delay: 10.66s; }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            16.67%, 83.33% { opacity: 1; }
        }

        /* Slide QR Code */
        .slide-qr {
            background: linear-gradient(135deg, #0052A3 0%, #001F4D 100%);
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .qr-title {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }

        .qr-subtitle {
            color: #E6F0FF;
            font-size: 32px;
            text-align: center;
        }

        #qrCode {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Slide Logo QUADRATA */
        .slide-logo {
            background: linear-gradient(135deg, #ffffff 0%, #F9FAFB 100%);
            gap: 30px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-image {
            width: 350px;
            height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0, 82, 163, 0.3));
        }

        .logo-text {
            color: #0052A3;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }

        .logo-subtitle {
            color: #6B7280;
            font-size: 28px;
            text-align: center;
        }

        /* Slide Porto Bank */
        .slide-porto {
            background: linear-gradient(135deg, #0052A3 0%, #001F4D 100%);
        }

        .porto-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            text-align: center;
        }

        .porto-logo {
            font-size: 80px;
        }

        .porto-title {
            color: white;
            font-size: 56px;
            font-weight: bold;
        }

        .porto-subtitle {
            color: #E6F0FF;
            font-size: 36px;
        }

        .porto-text {
            color: white;
            font-size: 28px;
            max-width: 800px;
            line-height: 1.6;
        }

        /* Indicador de slides */
        .dots {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: white;
            width: 40px;
            border-radius: 10px;
        }

        /* Texto de instrução */
        .instruction {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instruction">
            Escaneie o QR Code para participar do sorteio
        </div>

        <!-- Slide 1: QR Code -->
        <div class="slide slide-qr">
            <div class="qr-container">
                <div>
                    <div class="qr-title">Seguro Fiança Locatícia</div>
                    <div class="qr-subtitle">Sorteio de Brindes</div>
                </div>
                <div id="qrCode"></div>
                <div class="qr-subtitle">Escaneie para participar!</div>
            </div>
        </div>

        <!-- Slide 2: Logo QUADRATA -->
        <div class="slide slide-logo">
            <div class="logo-container">
                <img src="logoquadrataoficial.png" alt="Logo Quadrata" class="logo-image">
                <div class="logo-text">QUADRATA SEGUROS</div>
                <div class="logo-subtitle">Seguro Fiança Locatícia</div>
            </div>
        </div>

        <!-- Slide 3: Porto Bank -->
        <div class="slide slide-porto">
            <div class="porto-container">
                <div class="porto-logo">🏦</div>
                <div class="porto-title">PORTO BANK</div>
                <div class="porto-subtitle">Seguro Fiança Locatícia</div>
                <div class="porto-text">
                    Proteção garantida para seus inquilinos<br>
                    Confiança e segurança em cada contrato
                </div>
            </div>
        </div>

        <!-- Indicador de slides -->
        <div class="dots">
            <div class="dot active" onclick="goToSlide(0)"></div>
            <div class="dot" onclick="goToSlide(1)"></div>
            <div class="dot" onclick="goToSlide(2)"></div>
        </div>
    </div>

    <script>
        let currentSlide = 0;

        function goToSlide(n) {
            currentSlide = n;
            updateSlides();
            resetTimer();
        }

        function updateSlides() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            slides.forEach(slide => slide.style.opacity = '0');
            dots.forEach(dot => dot.classList.remove('active'));

            slides[currentSlide].style.opacity = '1';
            dots[currentSlide].classList.add('active');
        }

        function resetTimer() {
            // Timer automático
            setTimeout(() => {
                currentSlide = (currentSlide + 1) % 3;
                updateSlides();
                resetTimer();
            }, 16000); // 16 segundos por slide
        }

        function generateQRCode() {
            const url = window.location.href.split('projetor')[0]; // URL da página principal
            const qr = document.getElementById('qrCode');
            qr.innerHTML = '';
            new QRCode(qr, {
                text: url,
                width: 300,
                height: 300,
                colorDark: '#0052A3',
                colorLight: '#FFFFFF',
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Inicializar
        generateQRCode();
        updateSlides();
        resetTimer();
    </script>
</body>
</html>
